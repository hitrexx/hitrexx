# Порт: хостинги (Render, Railway, Amvera и т.п.) передают его через переменную PORT
server.port=${PORT:8080}
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json
spring.web.resources.cache.cachecontrol.max-age=1h

# Куда сохранять заявки (CSV-файл)
yudom.leads.file=${LEADS_FILE:data/leads.csv}

# Уведомления о заявках в Telegram. Оставьте пустыми, если не нужно.
yudom.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
yudom.telegram.chat-id=${TELEGRAM_CHAT_ID:}
